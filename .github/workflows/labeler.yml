name: Labeler

# Tags each PR with labels based on which addon/area it touches (see
# .github/labeler.yml) so the queue is easy to triage at a glance.
on:
  pull_request_target:
    branches: [develop, master]  # only PRs targeting develop/master

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
