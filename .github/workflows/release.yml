name: Release

# Cuts a GitHub Release ONLY when master advances (a develop -> master merge,
# i.e. an actual release). The version is X.Y.Z with Y bumped for this release
# and Z reset to 0 — see tools/gen-version.sh. This only publishes a tag and a
# changelog. No PBOs are attached: the Workshop mod is built and signed on Windows
# with tools/release.ps1, and credits_and_license.txt limits who may share some of
# what it contains.
on:
  push:
    branches: [master]
  workflow_dispatch:  # allow a manual re-cut from the Actions tab

permissions:
  contents: write  # needed to create the tag and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags for version + changelog

      - name: Compute release version
        id: ver
        run: |
          version=$(sh tools/gen-version.sh --release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Most recent existing release tag, for the changelog range.
          prev=$(git tag -l 'v*' | sort -V | tail -1)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous tag: ${prev:-none})"

      - name: Abort if tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.ver.outputs.tag }} already exists. Bump MAJOR in script_version.hpp or delete the stale tag."
            exit 1
          fi

      - name: Generate changelog
        id: log
        run: |
          if [ -n "${{ steps.ver.outputs.prev }}" ]; then
            range="${{ steps.ver.outputs.prev }}..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "body<<EOF"
            echo "## Changes since ${{ steps.ver.outputs.prev }}"
            echo ""
            # No --first-parent: on master that walk is nothing but merge commits,
            # which --no-merges then removes, leaving an empty changelog.
            git log "$range" --no-merges --pretty='- %s' || true
            echo ""
            echo "_The signed mod is published on the Steam Workshop._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # Without this the tag lands on the default branch (develop), not on the
          # master commit being released.
          target_commitish: ${{ github.sha }}
          name: PTF Core ${{ steps.ver.outputs.version }}
          body: ${{ steps.log.outputs.body }}
          make_latest: true
