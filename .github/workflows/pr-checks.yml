name: PR checks

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: write  # Danger posts/updates one PR comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: build artifacts and — above all — the private signing key must
  # never enter the repo. This blocks the merge if they do.
  guard:
    name: No secrets or build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          fail=0

          bad=$(git ls-files | grep -iE '\.(pbo|biprivatekey)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Build artifacts / private keys must not be committed:"
            printf '%s\n' "$bad" | sed 's/^/  /'
            fail=1
          fi

          big=$(git ls-files | while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            [ "$sz" -gt 94371840 ] && printf '%s (%sMB)\n' "$f" "$((sz / 1048576))"
          done)
          if [ -n "$big" ]; then
            echo "::error::Files over 90MB (GitHub rejects >100MB) — keep large assets out of git:"
            printf '%s\n' "$big" | sed 's/^/  /'
            fail=1
          fi

          markers=$(git grep -nE '^(<{7}|>{7})( |$)' -- ':!*.md' || true)
          if [ -n "$markers" ]; then
            echo "::error::Unresolved merge conflict markers found:"
            printf '%s\n' "$markers" | sed 's/^/  /'
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "guard: clean."
          exit "$fail"

  # Soft, friendly reminders on the PR (never blocks). See dangerfile.js.
  hygiene:
    name: PR hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Danger needs the base ref to diff the PR
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Danger
        run: npx --yes danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
